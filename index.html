<script>
const D=JSON.parse(document.getElementById('data').textContent);
const by=Object.fromEntries(D.dramas.map(d=>[d.t,d]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('upd').textContent='資料更新：'+D.updated+'　共 '+D.dramas.length+' 部';
document.getElementById('kpis').innerHTML=D.kpi.map(k=>`<div class="kpi"><b>${esc(k.v)}</b><span>${esc(k.l)}</span></div>`).join('');
function card(t,i,x={}){const d=by[t]||{t};const pc=d.p==='Disney+'?'dp':'nf';
 const meta=[d.y,d.g,d.e?d.e+' 集':'',d.imdb?'IMDb '+d.imdb:''].filter(Boolean).join(' · ');
 const rt=d.rt?`<span class="rt ${esc(d.rt)}">${esc(d.rt)}</span>`:(d.seen?'<span class="rt 看過">看過</span>':'');
 return `<div class="card" onclick="this.classList.toggle('open')"><div class="r1">${i?`<span class="rank">${i}</span>`:''}<span class="tt">${esc(d.t)}</span>${rt}<span class="pl ${pc}">${esc(d.p||'')}</span></div>
 <div class="meta">${esc(meta)}</div>${x.hit?`<div class="hit">★ 常看演員：${esc(x.hit)}</div>`:''}
 ${d.syn?`<div class="more">點一下看劇情大綱</div><div class="syn">${esc(d.syn)}${d.c?`<div class="why" style="margin-top:6px">主演：${esc(d.c)}</div>`:''}</div>`:''}</div>`}
const list=(arr,rank)=>arr.length?arr.map((x,i)=>card(x.t,rank?i+1:0,x)).join(''):'<div class="empty">目前沒有</div>';
const bars=(arr,color,max)=>{const m=max||Math.max(1,...arr.map(a=>a.v));return '<div class="bars">'+arr.map(a=>`<div class="b"><span class="n">${esc(a.n)}</span><div class="bar" style="width:${Math.round(a.v/m*70)}%;background:${color}"></div><span>${a.v}</span></div>`).join('')+'</div>'};
const donut=(arr,colors,unit)=>{const tot=arr.reduce((s,x)=>s+(x.v||0),0);let acc=0;
 const seg=tot?arr.map((x,i)=>{const a=acc/tot*360;acc+=x.v;return `${colors[i]} ${a}deg ${acc/tot*360}deg`}).join(','):'#3A3F4A 0deg 360deg';
 return `<div class="dn"><div class="ring" style="background:conic-gradient(${seg})"><div class="hole"><b>${tot}</b><span>${unit||'部'}</span></div></div><div class="lg">`+
  arr.map((x,i)=>`<div><i style="background:${colors[i]}"></i>${esc(x.n)}<b>${x.v}</b><span>${tot?Math.round(x.v/tot*100):0}%</span></div>`).join('')+'</div></div>'};
const box=(t,h)=>`<div class="box"><h2>${t}</h2>${h}</div>`;
const kgrid=k=>'<div class="kpis" style="padding:0;margin:4px 0 12px">'+k.map(x=>`<div class="kpi"><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join('')+'</div>';
let seg='nf';
const TABS={
 next:{n:'接下來看',f:()=>`<div class="seg"><button class="${seg==='nf'?'on':''}" onclick="seg='nf';go('next')">Netflix 前 20</button><button class="${seg==='dp'?'on':''}" onclick="seg='dp';go('next')">Disney+ 前 20</button></div>`+list(D.lists[seg],1)},
 want:{n:'想看清單',f:()=>`<h2>想看清單<small>在 Excel 打 ★ 的、還沒看的</small></h2>`+list(D.lists.want)},
 gem:{n:'遺珠・短篇',f:()=>`<h2>隱藏遺珠<small>對味但被低估</small></h2>`+list(D.lists.gem,1)+`<h2>短篇速追<small>≤12 集</small></h2>`+list(D.lists.short,1)},
 seen:{n:'看過的',f:()=>{const order=['神作','好看','普通','不推','地雷',''];const w=D.dramas.filter(d=>d.seen||d.rt);
  return `<h2>看過的<small>${w.length} 部</small></h2>`+order.map(r=>{const a=w.filter(d=>d.rt===r);return a.length?`<h2>${r||'看過（未評價）'}<small>${a.length} 部</small></h2>`+a.map(d=>card(d.t,0)).join(''):''}).join('')}},
 stat:{n:'我的口味',f:()=>{const T=D.taste;return `<div class="grid2">${box('評分分布',donut(T.rating,['#C99A2E','#46C77D','#8A93A3','#B4682B','#F26B66']))}${box('平台分布',donut(T.plat,['#E50914','#4DA3FF']))}${box('看過的類型',bars(T.genres,'#E7B24C'))}${box('常看演員 Top10',bars(T.actors,'#4DA3FF'))}</div>`}},
 stats:{n:'統計',f:()=>{const S=D.stats;return kgrid(S.kpi)+`<div class="grid2">${box('觀看進度',donut(S.prog,['#46C77D','#3A3F4A']))}${box('全清單平台',donut(S.plat,['#E50914','#4DA3FF']))}${box('平均 IMDb',bars(S.imdb,'#E7B24C',10))}${box('全清單熱門類型',bars(S.genres,'#4DA3FF'))}</div>`}},
 all:{n:'全部',f:()=>{const gs=[...new Set(D.dramas.flatMap(d=>d.g.split('、')).filter(Boolean))].sort();
  return `<div class="flt"><input id="q" placeholder="搜尋劇名、演員…" oninput="flt()"><select id="fp" onchange="flt()"><option value="">全部平台</option><option>Netflix</option><option>Disney+</option></select><select id="fs" onchange="flt()"><option value="">全部狀態</option><option value="n">還沒看</option><option value="s">看過</option><option value="w">想看★</option></select><select id="fg" onchange="flt()"><option value="">全部類型</option>${gs.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div class="cnt" id="cnt"></div><div id="res"></div>`}}
};
function flt(){const q=(document.getElementById('q').value||'').trim().toLowerCase(),p=document.getElementById('fp').value,st=document.getElementById('fs').value,g=document.getElementById('fg').value;
